[package]
name = "activator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
signal-activator-nexus = { git = "https://github.com/LiGoldragon/signal-activator-nexus", rev = "36c7fbc5992d79213e636bf6f02dbf22b1d91059" }
meta-signal-activator-nexus = { git = "https://github.com/LiGoldragon/meta-signal-activator-nexus", rev = "d3e8ef6df89a9117506e341e249f125b1274d847" }
tokio = { version = "1", features = ["fs", "process", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
